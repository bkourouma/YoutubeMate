name: Bug report
description: Something behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you write anything: redact.** Never paste an API key, a token, an
        OAuth code, an `Authorization` header, a signed URL, or a private script,
        transcript, photo or channel name. Four last characters of a key are enough to
        identify it. If the bug is a vulnerability, close this and read `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. The alert says …
    validations: { required: true }
  - type: input
    id: message
    attributes:
      label: Exact message shown
      description: Copy it verbatim, including any error code.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Script Studio (long form)
        - Shorts Studio
        - Video package
        - Short package
        - Credits Usage
        - Settings / keys
        - Export (Word, CapCut kit)
        - Elsewhere
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`.
  - type: input
    id: environment
    attributes:
      label: OS, Node version, browser
      placeholder: "Windows 11, Node 22.13.0, Chrome 141"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted. Console output, or the response body of the failing request.
      render: text
